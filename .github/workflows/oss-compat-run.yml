name: OSS compatibility study (manual, frozen)

on:
  workflow_dispatch:
    inputs:
      study_id:
        description: "Must be the frozen study id"
        required: true
        default: "oss-pilot-01"
      manifest_sha256:
        description: "Exact SHA-256 of the already-published manifest"
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: oss-compat-oss-pilot-01
  cancel-in-progress: false

jobs:
  run-case:
    name: ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: requests-pr-7498-source-only, runtime: python}
          - {case: requests-pr-7502-test-edit, runtime: python}
          - {case: express-pr-7265-source-only, runtime: node}
          - {case: express-pr-7377-test-edit, runtime: node}
          - {case: fzf-pr-4734-source-only, runtime: go}
          - {case: fzf-pr-4797-test-edit, runtime: go}
          - {case: ripgrep-pr-3464-source-only, runtime: rust}
          - {case: ripgrep-pr-3467-test-edit, runtime: rust}
          - {case: fmt-pr-4822-source-only, runtime: cpp}
          - {case: fmt-pr-4825-test-edit, runtime: cpp}
          - {case: cjson-pr-1006-source-only, runtime: c}
          - {case: cjson-pr-991-test-edit, runtime: c}
    steps:
      - name: Checkout frozen protocol
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.10"

      - name: Prove first API-visible dispatch
        env:
          OSS_ACTIONS_TOKEN: ${{ github.token }}
        run: python harness/check_canonical_dispatch.py

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.runtime == 'node'
        with:
          node-version: "24.14.1"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: matrix.runtime == 'go'
        with:
          go-version: "1.23.12"
          cache: false

      - name: Pin Rust 1.85.0
        if: matrix.runtime == 'rust'
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
          dirname "$(rustup which cargo --toolchain 1.85.0)" >> "$GITHUB_PATH"

      - name: Verify frozen study identity
        shell: bash
        env:
          INPUT_STUDY: ${{ inputs.study_id }}
          INPUT_MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          test "$INPUT_STUDY" = "oss-pilot-01"
          ACTUAL="$(sha256sum studies/oss-compat-v1/manifests/oss-pilot-01.json | cut -d' ' -f1)"
          test "$ACTUAL" = "$INPUT_MANIFEST_SHA"
          python harness/freeze_oss_cases.py --check
          python harness/make_oss_manifest.py oss-pilot-01 --check

      - name: Install trusted execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/unshare
          test -x /usr/bin/setpriv
          /usr/bin/setpriv --help | grep -q -- '--pdeathsig'

          if ! id -u evoom-oss-untrusted >/dev/null 2>&1; then
            sudo useradd --system --no-create-home --home-dir /nonexistent \
              --shell /usr/sbin/nologin evoom-oss-untrusted
          fi
          test "$(id -u evoom-oss-untrusted)" != "0"
          test "$(id -u evoom-oss-untrusted)" != "$(id -u)"

          sudo install -d -o root -g root -m 0711 \
            /var/lib/evoom-oss /var/lib/evoom-oss/work
          sudo install -d -o root -g root -m 0700 \
            /var/lib/evoom-oss/source \
            /var/lib/evoom-oss/output \
            /var/lib/evoom-oss/state \
            /var/lib/evoom-oss/trusted-home
          sudo install -d -o root -g root -m 0755 /var/lib/evoom-oss/tools
          sudo install -o root -g root -m 0755 \
            harness/oss_untrusted_exec.py \
            /usr/local/sbin/evoom-oss-untrusted-exec

          PYTHON_BIN="$(command -v python)"
          NPM_BIN="$(command -v npm)"
          GO_BIN="$(command -v go)"
          CARGO_BIN="$(command -v cargo)"
          CMAKE_BIN="$(command -v cmake)"
          for TOOL_PATH in \
            "$PYTHON_BIN" "$NPM_BIN" "$GO_BIN" "$CARGO_BIN" "$CMAKE_BIN"; do
            test -n "$TOOL_PATH"
            test -x "$TOOL_PATH"
          done

          for TOOL in python npm go cargo cmake node rustc gcc g++ make git; do
            TARGET="$(command -v "$TOOL" || true)"
            if test -n "$TARGET"; then
              sudo ln -s -- "$TARGET" "/var/lib/evoom-oss/tools/$TOOL"
            fi
          done
          sudo chmod 0555 /var/lib/evoom-oss/tools

          CONFIG_TMP="$RUNNER_TEMP/evoom-oss-boundary.json"
          "$PYTHON_BIN" - \
            "$CONFIG_TMP" "$(id -u)" "$(id -g)" \
            "$PYTHON_BIN" "$NPM_BIN" "$GO_BIN" "$CARGO_BIN" "$CMAKE_BIN" <<'PY'
          import json
          import sys

          destination, publisher_uid, publisher_gid, python, npm, go, cargo, cmake = sys.argv[1:]
          config = {
              "root": "/var/lib/evoom-oss",
              "work_root": "/var/lib/evoom-oss/work",
              "source_root": "/var/lib/evoom-oss/source",
              "output_root": "/var/lib/evoom-oss/output",
              "state_root": "/var/lib/evoom-oss/state",
              "trusted_home": "/var/lib/evoom-oss/trusted-home",
              "untrusted_user": "evoom-oss-untrusted",
              "publisher_uid": int(publisher_uid),
              "publisher_gid": int(publisher_gid),
              "real_tools": {
                  "python": python,
                  "npm": npm,
                  "go": go,
                  "cargo": cargo,
                  "cmake": cmake,
              },
          }
          with open(destination, "x", encoding="utf-8", newline="\n") as handle:
              json.dump(config, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          sudo install -o root -g root -m 0600 \
            "$CONFIG_TMP" /etc/evoom-oss-boundary.json
          rm -f -- "$CONFIG_TMP"
          sudo /usr/local/sbin/evoom-oss-untrusted-exec --self-test

      - name: Run frozen case
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(command -v python)"
          sudo env -i \
            PATH=/var/lib/evoom-oss/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/var/lib/evoom-oss/trusted-home \
            TMPDIR=/var/lib/evoom-oss/work \
            LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 \
            GITHUB_ACTIONS=true \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_REF="$GITHUB_REF" \
            GITHUB_REF_NAME="$GITHUB_REF_NAME" \
            GITHUB_REF_TYPE="$GITHUB_REF_TYPE" \
            GITHUB_REF_PROTECTED="$GITHUB_REF_PROTECTED" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            OSS_CANONICAL_DISPATCH_ID="$OSS_CANONICAL_DISPATCH_ID" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" \
            ImageOS="${ImageOS:-}" ImageVersion="${ImageVersion:-}" \
            "$PYTHON_BIN" harness/run_oss_case.py "${{ matrix.case }}" \
              --study oss-pilot-01 \
              --work-root /var/lib/evoom-oss/source \
              --output-root /var/lib/evoom-oss/output

      - name: Kill residual untrusted processes
        id: trusted_cleanup
        if: always()
        shell: bash
        run: >-
          sudo env -i
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          /usr/local/sbin/evoom-oss-untrusted-exec
          --cleanup --purge-homes

      - name: Upload immutable raw case output
        if: ${{ always() && steps.trusted_cleanup.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oss-${{ matrix.case }}
          path: /var/lib/evoom-oss/output/oss-pilot-01/${{ matrix.case }}
          if-no-files-found: error
          retention-days: 90
